name: OpenTypeless
options:
  bundleIdPrefix: com.scinttt
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  OpenAI:
    url: https://github.com/MacPaw/OpenAI.git
    branch: main

targets:
  OpenTypeless:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: OpenAI
    sources:
      - path: Sources/OpenTypeless
      - path: Resources
      - path: PRIVACY.md
        buildPhase: resources
    info:
      path: Sources/OpenTypeless/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: "OpenTypeless records your voice and sends it to the transcription provider you select after you consent."
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: Sources/OpenTypeless/OpenTypeless.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.scinttt.open-typeless
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scinttt.open-typeless
        PRODUCT_NAME: OpenTypeless
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 2
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development

  OpenTypelessTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Tests/OpenTypelessTests
    dependencies:
      - target: OpenTypeless
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scinttt.open-typeless-tests
        GENERATE_INFOPLIST_FILE: true
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development

schemes:
  OpenTypeless:
    build:
      targets:
        OpenTypeless: all
        OpenTypelessTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpenTypelessTests
